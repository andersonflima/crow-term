name: Native CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        # Temporary repository toggle; unset/false restores all platforms.
        os: ${{ fromJSON(vars.CROW_MACOS_ONLY == 'true' && '["macos-15"]' || '["ubuntu-24.04","macos-15","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Linux native dependencies and editor/shell fixtures
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev fish zsh tmux neovim fonts-noto-color-emoji
      - run: cargo fmt --check
      - run: cargo build --locked
      - name: Check locked dependency notice bundle
        if: runner.os == 'Linux'
        run: python scripts/third_party_notices.py --check
      - name: Isolated daemon and real PTY integration
        run: python tests/daemon_e2e.py
      - name: Terminal query reply matrix
        run: python tests/protocol_probe.py
      - name: Daemon link under load (8 flooding panes, typing latency; optimized build)
        shell: bash
        run: |
          # Latency is a property of the shipped (optimized) binary; a debug
          # build is ~20x slower in snapshot code and measures the compiler.
          cargo build --profile stress --locked
          exe=target/stress/crow-term; [[ "${RUNNER_OS}" == "Windows" ]] && exe="${exe}.exe"
          CROW_TERM_BIN="${exe}" python tests/link_stress.py
      - name: macOS login-shell fixtures
        if: runner.os == 'macOS'
        run: brew install fish
      - name: Login shells (bash, zsh, fish, pwsh, sh, dash; launchd-like environment)
        if: runner.os != 'Windows'
        env:
          CROW_REQUIRE_SHELLS: ${{ runner.os == 'Linux' && 'bash,zsh,fish,pwsh,sh,dash' || 'bash,zsh,fish,pwsh,sh' }}
        run: python tests/login_shell_e2e.py
      - name: Offline shell profiles (Unix/WSL contract)
        if: runner.os != 'Windows'
        run: python tests/shell_setup.py
      - name: Homebrew tap renderer
        run: python tests/update_tap_test.py
      - name: npm packages and launcher
        run: python tests/npm_package_test.py
      - name: GUI journey tooling (codecs, diff, grid lookup)
        run: python tests/gui_tools_test.py
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test-only hooks (features frame-dump, test-hooks)
        run: cargo clippy --locked --all-targets --features frame-dump,test-hooks -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Release binary
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: cargo build --release --locked
      - name: Package portable application
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python scripts/package.py
      - name: Upload portable build
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crow-term-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.*
          if-no-files-found: error
          retention-days: 14
  gpu:
    # GPU renderer: offscreen GPU frames of the real UI composition must match
    # the software renderer within the golden tolerance (<= 2 per channel on
    # <= 0.1% of pixels). Linux uses Mesa lavapipe (Vulkan on the CPU) and
    # Windows DX12 WARP, so these jobs require an adapter; macOS uses the
    # runner's Metal device when one is exposed and logs the reason when not.
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(vars.CROW_MACOS_ONLY == 'true'
          && '{"include":[{"os":"macos-15","require":"0","backend":"metal"}]}'
          || '{"include":[{"os":"ubuntu-24.04","require":"1","backend":"vulkan"},{"os":"windows-2025","require":"1","backend":"dx12"},{"os":"macos-15","require":"0","backend":"metal"}]}') }}
    name: gpu (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CROW_TERM_GPU_TESTS: ${{ matrix.require }}
      WGPU_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Linux native dependencies, Mesa lavapipe and emoji font
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev mesa-vulkan-drivers libvulkan1 fonts-noto-color-emoji
      - name: GPU vs software goldens and GPU unit tests
        run: cargo test --locked --lib -- 'render::' 'fixture::' --nocapture
      - name: Renderer A/B benchmark (informative; offscreen, no present)
        shell: bash
        run: |
          cargo build --release --locked
          bin=target/release/crow-term
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          "$bin" doctor | grep -E '^(renderer|gpu):'
          for grid in 120x40 300x80; do
            for backend in software gpu software gpu; do
              "$bin" bench-render --backend "$backend" --cols "${grid%x*}" --rows "${grid#*x}" --frames 200 \
                | tee -a bench-render.jsonl || echo "bench-render $backend $grid unavailable"
            done
          done
      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-render-${{ matrix.os }}
          path: bench-render.jsonl
          if-no-files-found: ignore
          retention-days: 14
  neovim:
    # Pinned upstream Neovim releases (SHA-256 checked by scripts/fetch_neovim.py)
    # against the real daemon PTY. LazyVim requires Neovim >= 0.11.2.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.CROW_MACOS_ONLY == 'true' && '["macos-15"]' || '["ubuntu-24.04","macos-15"]') }}
        nvim: ['0.11.7', '0.12.6']
    name: neovim ${{ matrix.nvim }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CROW_TERM_REQUIRE_NVIM: '1'
      CROW_TERM_NVIM_VERSION: ${{ matrix.nvim }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev ripgrep fd-find
          mkdir -p "$HOME/.local/bin" && ln -sf "$(command -v fdfind)" "$HOME/.local/bin/fd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: macOS LazyVim search tools
        if: runner.os == 'macOS'
        run: brew install ripgrep fd
      - name: Pinned Neovim
        run: |
          nvim="$(python scripts/fetch_neovim.py '${{ matrix.nvim }}' --dest "$RUNNER_TEMP/neovim")"
          echo "CROW_TERM_NVIM=$nvim" >> "$GITHUB_ENV"
      - run: cargo build --locked
      - name: Neovim through the daemon PTY
        run: |
          python tests/daemon_e2e.py DaemonTests.test_neovim_alternate_screen_input_and_clean_exit
          python tests/nvim_e2e.py
      - name: Cached LazyVim plugins (keyed by the lockfile)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lazyvim
          key: lazyvim-${{ runner.os }}-${{ hashFiles('tests/lazyvim/**', 'tests/lazyvim_bootstrap.py') }}
      - name: LazyVim bootstrap (the only network step)
        run: python tests/lazyvim_bootstrap.py --home "$RUNNER_TEMP/lazyvim"
      - name: LazyVim through the daemon PTY (offline)
        env:
          CROW_LAZYVIM_HOME: ${{ runner.temp }}/lazyvim
        run: python tests/lazyvim_e2e.py
