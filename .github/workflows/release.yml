name: Release

# Builds portable archives for macOS, Linux and Windows on native runners, signs
# and notarizes the macOS app when the secrets exist, and on a `v*` tag publishes
# a GitHub Release with SHA256 files and build provenance. `workflow_dispatch` is
# a dry run: same builds (signing included when configured), workflow artifacts
# only, no release and no attestation. See docs/release.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Change through the repository variable MACOS_SIGN_IDENTITY, not by editing steps.
  MACOS_SIGN_IDENTITY: "${{ vars.MACOS_SIGN_IDENTITY || 'Developer ID Application: Anderson Espindola (W395FZKTJ7)' }}"

jobs:
  prepare:
    name: Version and tag check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: version
        run: |
          version="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import package; print(package.cargo_version())')"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Cargo.toml version '${version}' is not semver"; exit 1
          fi
          publish=false
          # Only a tag *push* publishes; a manual dispatch is always a dry run.
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}"; exit 1
            fi
            publish=true
          else
            echo "Dry run on ${GITHUB_REF_NAME}: artifacts only, no release."
          fi
          prerelease=false
          [[ "${version}" == *-* ]] && prerelease=true
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "prerelease=${prerelease}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: macos-arm64 }
          # Intel macOS: macos-13 is retired; macos-15-intel is the supported x86_64 label.
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: ubuntu-24.04, target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-2025, target: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      CROW_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - run: cargo build --release --locked

      - name: Stage portable tree (and macOS app bundle)
        run: |
          python scripts/package.py stage --version "${VERSION}"
          stage="dist/crow-term-${VERSION}-${TARGET}"
          test -d "${stage}" || { echo "::error::package.py staged a different target than ${TARGET}"; ls dist; exit 1; }
          echo "STAGE=${stage}" >> "${GITHUB_ENV}"
          echo "APP=${stage}/Crow Term.app" >> "${GITHUB_ENV}"

      - name: Smoke test staged binary
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            "${STAGE}/crow-term.exe" --version | grep -F "crow-term ${VERSION}"
            exit 0
          fi
          "${STAGE}/crow-term" --version | grep -F "crow-term ${VERSION}"
          "${STAGE}/crow-term" shell-setup --shell fish --prefix "${RUNNER_TEMP}/crow-profile" --dry-run
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            # The cask links bin/crow-term straight into the bundle: shell-setup must
            # resolve Contents/Resources/shell (needs the bundled lookup in src/main.rs).
            "${APP}/Contents/MacOS/crow-term" shell-setup --shell zsh --prefix "${RUNNER_TEMP}/crow-profile-app" --dry-run
          fi

      - name: Sign app bundle (macOS, Developer ID)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [[ -z "${CSC_LINK}" ]]; then
            # package.py already sealed the bundle with an ad-hoc signature.
            echo "CSC_LINK not set: producing UNSIGNED (ad-hoc signed) build"
            echo "SIGNED=false" >> "${GITHUB_ENV}"
            exit 0
          fi
          umask 077
          kc="${RUNNER_TEMP}/crow-signing.keychain-db"
          p12="${RUNNER_TEMP}/crow-signing.p12"
          kc_pass="$(openssl rand -base64 32)"
          echo "::add-mask::${kc_pass}"
          printf '%s' "${CSC_LINK}" | base64 --decode > "${p12}"
          security create-keychain -p "${kc_pass}" "${kc}"
          security set-keychain-settings -lut 21600 "${kc}"
          security unlock-keychain -p "${kc_pass}" "${kc}"
          security import "${p12}" -k "${kc}" -f pkcs12 -P "${CSC_KEY_PASSWORD}" -T /usr/bin/codesign >/dev/null
          rm -f "${p12}"
          # -k takes the KEYCHAIN password (not the .p12 one); otherwise codesign prompts and hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${kc_pass}" "${kc}" >/dev/null
          # Keep existing keychains in the search list (entries are space-free system paths).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "${kc}" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "${kc}" | grep -qF "\"${MACOS_SIGN_IDENTITY}\""; then
            echo "::error::Identity '${MACOS_SIGN_IDENTITY}' not found in CSC_LINK"; exit 1
          fi
          sign=(codesign --force --options runtime --timestamp
                --entitlements packaging/macos/entitlements.plist
                --keychain "${kc}" --sign "${MACOS_SIGN_IDENTITY}")
          # Inner executable first, then the bundle (which seals Info.plist and Resources).
          "${sign[@]}" "${APP}/Contents/MacOS/crow-term"
          "${sign[@]}" "${APP}"
          codesign --verify --strict --deep --verbose=2 "${APP}"
          codesign -dv --verbose=2 "${APP}" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp|CodeDirectory)'
          echo "SIGNED=true" >> "${GITHUB_ENV}"

      - name: Notarize and staple (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "NOTARIZED=false" >> "${GITHUB_ENV}"
          if [[ "${SIGNED}" != "true" ]]; then
            echo "Notarization skipped: build is not signed"; exit 0
          fi
          missing=()
          for name in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || missing+=("${name}")
          done
          if (( ${#missing[@]} )); then
            echo "Notarization skipped: missing secrets ${missing[*]} (signed but NOT notarized)"; exit 0
          fi
          team="$(codesign -dv "${APP}" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [[ "${team}" != "${APPLE_TEAM_ID}" ]]; then
            echo "::error::Signing certificate team does not match APPLE_TEAM_ID"; exit 1
          fi
          umask 077
          key="${RUNNER_TEMP}/crow-notary-key.p8"
          # Accept the raw .p8 (PEM) or its base64 encoding.
          if grep -q -- '-----BEGIN PRIVATE KEY-----' <<<"${APPLE_API_KEY_P8}"; then
            printf '%s\n' "${APPLE_API_KEY_P8}" > "${key}"
          else
            printf '%s' "${APPLE_API_KEY_P8}" | base64 --decode > "${key}"
          fi
          zip="${RUNNER_TEMP}/crow-notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP}" "${zip}"
          auth=(--key "${key}" --key-id "${APPLE_API_KEY_ID}" --issuer "${APPLE_API_ISSUER}")
          xcrun notarytool submit "${zip}" "${auth[@]}" --wait --timeout 45m --output-format json \
            > "${RUNNER_TEMP}/notary.json"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "${RUNNER_TEMP}/notary.json")"
          id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "${RUNNER_TEMP}/notary.json")"
          echo "Notarization ${id}: ${status}"
          if [[ "${status}" != "Accepted" ]]; then
            [[ -n "${id}" ]] && xcrun notarytool log "${id}" "${auth[@]}" || true
            echo "::error::Notarization status ${status}"; exit 1
          fi
          xcrun stapler staple "${APP}"
          xcrun stapler validate "${APP}"
          spctl --assess --type execute -vv "${APP}"
          echo "NOTARIZED=true" >> "${GITHUB_ENV}"

      - name: Remove signing material (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          kc="${RUNNER_TEMP}/crow-signing.keychain-db"
          if [[ -f "${kc}" ]]; then security delete-keychain "${kc}" || rm -f "${kc}"; fi
          rm -f "${RUNNER_TEMP}/crow-signing.p12" "${RUNNER_TEMP}/crow-notary-key.p8" \
                "${RUNNER_TEMP}/crow-notarize.zip"
          echo "Signing material removed."

      - name: Authenticode signing (Windows, TODO)
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          echo "SIGNED=false" >> "${GITHUB_ENV}"
          if [[ -z "${WINDOWS_CERT_PFX}" ]]; then
            echo "WINDOWS_CERT_PFX not set: Windows build is UNSIGNED (Authenticode is a TODO; no certificate yet)"
            exit 0
          fi
          # TODO: decode the .pfx, `signtool sign /fd sha256 /tr <RFC3161 URL> /td sha256 /f <pfx> /p <pwd>`
          # on ${STAGE}/crow-term.exe, then `signtool verify /pa`. Fail closed until implemented.
          echo "::error::WINDOWS_CERT_PFX is set but Authenticode signing is not implemented yet"
          exit 1

      - name: Archive and checksum
        run: |
          python scripts/package.py archive --version "${VERSION}"
          mkdir -p dist/status
          printf '{"target":"%s","signed":%s,"notarized":%s}\n' \
            "${TARGET}" "${SIGNED:-false}" "${NOTARIZED:-false}" > "dist/status/${TARGET}.json"
          cat "dist/status/${TARGET}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/status/*.json
          if-no-files-found: error
          retention-days: 14

  collect:
    name: Checksums and summary
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and write SHA256SUMS
        working-directory: dist
        run: |
          shopt -s nullglob
          sums=(*.sha256)
          (( ${#sums[@]} )) || { echo "::error::No archives"; exit 1; }
          sha256sum -c "${sums[@]}"
          cat "${sums[@]}" | sort -k2 > SHA256SUMS
          for asset in \
            "macos-arm64.tar.gz" "macos-arm64.app.zip" "macos-x86_64.tar.gz" "macos-x86_64.app.zip" \
            "linux-x86_64.tar.gz" "linux-arm64.tar.gz" "windows-x86_64.zip"; do
            grep -qF "  crow-term-${VERSION}-${asset}" SHA256SUMS || { echo "::error::missing ${asset}"; exit 1; }
          done
          cat SHA256SUMS
      - name: Job summary
        run: |
          notarized=true
          for f in dist/status/macos-*.json; do
            grep -q '"notarized":true' "${f}" || notarized=false
          done
          flag=""
          [[ "${notarized}" == "true" ]] && flag=" --notarized"
          {
            echo "## Crow Term ${VERSION}"
            echo
            echo "| target | signed | notarized |"
            echo "|---|---|---|"
            for f in dist/status/*.json; do
              jq -r '"| \(.target) | \(.signed) | \(.notarized) |"' "${f}"
            done
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Update the Homebrew tap after the release is published (from a crow-term checkout):"
            echo
            echo '```sh'
            echo "python3 scripts/update_tap.py --version ${VERSION} --tap \"\$(brew --repository andersonflima/tap)\" \\"
            echo "  --sha256sums https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/SHA256SUMS${flag}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub Release
    needs: [prepare, collect]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload assets
      actions: read # confirm Native CI passed for the tagged commit
      id-token: write # keyless Sigstore signing for provenance
      attestations: write # store the provenance attestation
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: dist
      - name: Require a green Native CI run for this commit
        run: |
          # Native CI also runs on the tag push; wait for it (or a main run of the same SHA).
          for attempt in $(seq 1 60); do
            runs="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${GITHUB_SHA}" \
                      --json status,conclusion --limit 20)"
            ok="$(jq '[.[] | select(.conclusion == "success")] | length' <<<"${runs}")"
            pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"${runs}")"
            if (( ok > 0 )); then echo "Native CI passed for ${GITHUB_SHA}"; exit 0; fi
            if (( pending == 0 && attempt > 2 )); then
              echo "::error::No successful Native CI run for ${GITHUB_SHA}"; exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for Native CI"; exit 1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Create or update the release
        run: |
          args=(--repo "${GITHUB_REPOSITORY}")
          if gh release view "${TAG}" "${args[@]}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS --clobber "${args[@]}"
          else
            flags=(--verify-tag --title "Crow Term ${TAG}" --generate-notes)
            [[ "${PRERELEASE}" == "true" ]] && flags+=(--prerelease)
            gh release create "${TAG}" dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS "${flags[@]}" "${args[@]}"
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "${GITHUB_STEP_SUMMARY}"

  npm:
    name: npm packages
    # After the GitHub Release on a tag (publishes); after collect on a dry run
    # (builds, packs and smoke-tests, publishes nothing).
    needs: [prepare, collect, publish]
    if: always() && needs.collect.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support
        run: npm install -g npm@11 && npm --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: dist
      - name: Build the npm packages from the release archives
        run: |
          python tests/npm_package_test.py
          python scripts/npm_package.py --dist dist --out npm-dist --version "${VERSION}"
      - name: Pack and smoke-test the linux-x64 install layout
        run: |
          mkdir -p packs
          for directory in npm-dist/*/; do
            (cd "${directory}" && npm pack --pack-destination "${GITHUB_WORKSPACE}/packs" >/dev/null)
          done
          ls -l packs
          # The layout npm creates for `npm i -g`, from the packed tarballs
          # (file modes included), without contacting the registry.
          prefix="${RUNNER_TEMP}/npm-smoke/node_modules/@andespindola"
          mkdir -p "${prefix}/crow-term" "${prefix}/crow-term-linux-x64"
          tar -xzf "packs/andespindola-crow-term-${VERSION}.tgz" -C "${prefix}/crow-term" --strip-components=1
          tar -xzf "packs/andespindola-crow-term-linux-x64-${VERSION}.tgz" -C "${prefix}/crow-term-linux-x64" --strip-components=1
          node "${prefix}/crow-term/bin/crow-term.js" --version | grep -F "crow-term ${VERSION}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-packages
          path: packs/*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Publish (platform packages first, then the launcher)
        if: env.PUBLISH == 'true'
        run: |
          # Alpha-only project: prereleases also take the `latest` tag so that
          # `npm i -g @andespindola/crow-term` installs them.
          tag=latest
          for pack in packs/andespindola-crow-term-*-"${VERSION}".tgz; do
            npm publish "${pack}" --access public --tag "${tag}"
          done
          npm publish "packs/andespindola-crow-term-${VERSION}.tgz" --access public --tag "${tag}"
