name: GUI journeys (Windows)
# Real GUI + daemon + ConPTY on the runner's interactive desktop, driven with
# SendInput (tests/gui/drivers/wingui.cs). Evidence is uploaded as an artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Upload candidate goldens for review
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: gui-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journeys:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CROW_TERM_REQUIRE_NVIM: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pinned Symbols Nerd Font
        run: python tests/gui/fetch_fonts.py
      - name: Pinned Neovim
        shell: bash
        run: |
          nvim="$(python scripts/fetch_neovim.py 0.11.7 --dest "$RUNNER_TEMP/neovim")"
          echo "CROW_TERM_NVIM=$nvim" >> "$GITHUB_ENV"
      - run: cargo build --locked --features frame-dump
      - name: Journeys
        shell: bash
        run: |
          python tests/gui/journeys.py --driver windows --goldens windows --artifacts gui-artifacts --require-goldens \
            ${{ inputs.update_goldens && '--update-goldens' || '' }} \
            --expect-pass J1,J2,J3,J4,J5,J6,J7,J8,J10,J9
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gui-windows
          path: gui-artifacts
          retention-days: 14
