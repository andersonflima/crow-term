# Headless sway for the Wayland GUI journeys (tests/gui/drivers/wayland.py).
output HEADLESS-1 resolution 1600x1000 position 0 0 scale 1
default_border none
default_floating_border none
focus_follows_mouse no
xwayland disable
# Float the terminal at a fixed size so frames are comparable with goldens.
for_window [title="^crow-term"] floating enable, resize set width 1120 px height 760 px, move position 0 0
workspace 1
