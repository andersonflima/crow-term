[package]
name = "crow-term"
version = "0.1.0-alpha.3"
edition = "2024"
license = "MIT"
description = "A native Crow terminal, built in Rust"
repository = "https://github.com/andersonflima/crow-term"

[dependencies]
anyhow = "1"
alacritty_terminal = "0.26"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
toml = "0.9"
directories = "6"
interprocess = "2.4"
winit = "0.30"
softbuffer = "0.4"
cosmic-text = "0.19"
arboard = { version = "3.7", features = ["wayland-data-control"] }
clap = { version = "4", features = ["derive"] }
which = "8"
unicode-width = "0.2"
unicode-segmentation = "1"
etagere = "0.3"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"

[features]
# Test-only: write each presented GUI frame to $CROW_TERM_FRAME_DUMP/frame.ppm
# (tests/gui). Never enabled in release builds.
frame-dump = []
# Test-only: daemon fault injection for the GUI journeys (tests/gui). Never
# enabled in release builds.
test-hooks = []

# Optimized like release but quick to build (no LTO, parallel codegen): the
# binary CI measures for latency (tests/link_stress.py).
[profile.stress]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
png = "0.18"

# GPU renderer: one native backend per platform keeps the binary and driver
# surface small. The software framebuffer stays the mandatory fallback.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "metal"] }
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "gles"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12"] }
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_Security","Win32_System_Threading","Win32_System_Pipes"] }
